<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart | Pragati</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-nav="cart">
    <div id="site-header-mount"></div>

    <main class="min-h-screen pt-24 pb-20 bg-neutral-50" style="min-height:60vh;padding-top:6rem">
      <div class="taj-container max-w-4xl" style="max-width:56rem">
        <div class="mb-10">
          <h1 class="text-4xl font-serif text-neutral-900 mb-2" style="font-family:Playfair Display,serif">Your Cart</h1>
          <p class="text-neutral-600">Review your selections before you visit or reserve a table.</p>
        </div>

        <div id="cart-empty" class="rounded-2xl border border-neutral-200 bg-white p-12 text-center shadow-sm">
          <p class="text-4xl mb-4">🛒</p>
          <h2 class="text-xl font-serif text-neutral-800 mb-2" style="font-family:Playfair Display,serif">Your cart is empty</h2>
          <p class="text-neutral-600 mb-8 max-w-md mx-auto">Browse our menu and add dishes you would like to order.</p>
          <a href="menu.html" class="btn btn--primary btn--lg">Explore Menu</a>
        </div>

        <div id="cart-summary" class="hidden">
          <div id="cart-lines"></div>
          <div class="rounded-2xl border border-neutral-200 bg-white p-8 shadow-sm mt-8">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
              <div>
                <p class="text-sm text-neutral-500 uppercase tracking-wide">Total</p>
                <p class="text-3xl font-serif text-neutral-900" id="cart-total" style="font-family:Playfair Display,serif">₹0</p>
              </div>
              <div class="flex flex-col sm:flex-row gap-3">
                <button type="button" id="cart-clear" class="btn btn--outline">Clear cart</button>
                <a href="reservation.html" class="btn btn--primary btn--lg">Book a table</a>
              </div>
            </div>
            <p class="text-sm text-neutral-500">
              Prices are indicative. Final bill may vary.
              <a href="contact.html" class="text-gold">Contact us</a> for large orders.
            </p>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer-mount"></div>
    <script src="/js/layout.js" defer></script>
    <script src="/js/cart-store.js" defer></script>
    <script src="/js/nav.js" defer></script>
    <script src="/js/utils.js" defer></script>
    <script src="/js/cart-page.js" defer></script>
  </body>
</html>
